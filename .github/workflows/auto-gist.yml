
name: 🚀 Auto Update 12 Gists

on:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
  workflow_dispatch:

jobs:
  update-all-gists:
    name: 📤 Update All 12 Gists
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: 🔧 Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq
      
      # ========== Gist 1: Services ==========
      - name: 📤 Update Services Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          echo "📦 Processing services..."
          
          # Create combined file
          > combined_services.dart
          
          # Check if directory exists
          if [ -d "lib/services" ]; then
            # Find all .dart files and combine them
            find lib/services -type f -name "*.dart" -print0 | while IFS= read -r -d '' file; do
              if [ -f "$file" ]; then
                echo "// File: $file" >> combined_services.dart
                cat "$file" >> combined_services.dart
                echo "" >> combined_services.dart
              fi
            done
          fi
          
          # If file is empty, add placeholder
          if [ ! -s combined_services.dart ]; then
            echo "// No services files found" > combined_services.dart
          fi
          
          # Convert to JSON
          CONTENT=$(jq -Rs . < combined_services.dart)
          
          # Update Gist
          HTTP_CODE=$(curl -w "%{http_code}" -o response.json -X PATCH \
            -H "Authorization: token ${GIST_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/gists/e80061ac176f7dee39a2cb4866ff77a1" \
            -d "{\"files\":{\"services.dart\":{\"content\":$CONTENT}}}")
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Services Gist updated successfully!"
          else
            echo "❌ Failed with HTTP $HTTP_CODE"
            cat response.json
            exit 1
          fi
      
