name: 🚀 Auto Update 12 Gists

on:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
  workflow_dispatch:

jobs:
  update-gists:
    name: 📤 Update All 12 Gists
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v3
      
      - name: 🔧 Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y jq
      
      # Services
      - name: 📤 Services
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          > combined.dart
          [ -d "lib/services" ] && find lib/services -name "*.dart" -exec cat {} + >> combined.dart
          [ ! -s combined.dart ] && echo "// Empty" > combined.dart
          
          SIZE=$(wc -c < combined.dart)
          [ "$SIZE" -gt 900000 ] && head -c 900000 combined.dart > combined.dart.tmp && mv combined.dart.tmp combined.dart && echo "// Truncated" >> combined.dart
          
          CONTENT=$(jq -Rs . < combined.dart)
          curl -X PATCH -H "Authorization: token ${GIST_TOKEN}" \
            "https://api.github.com/gists/e80061ac176f7dee39a2cb4866ff77a1" \
            -d "{\"files\":{\"services.dart\":{\"content\":$CONTENT}}}"
      
      # Screens
      - name: 📤 Screens
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
