name: profit_calculator
description: "تطبيق حاسبة الأرباح - تطبيق متكامل لإدارة المخزون والمنتجات وحساب الأرباح مع ميزات متقدمة مثل التنبيهات والإشعارات والمزامنة السحابية."
publish_to: 'none'

# تحديد الإصدار ورقم البناء
version: 1.1.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  # Flutter Framework
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
    
  # Core UI Components
  cupertino_icons: ^1.0.8
  adaptive_theme: ^3.6.0
  google_fonts: ^6.3.2
  
  # Removed unused UI dependencies
  # glassmorphism: ^3.0.0
  # flutter_svg: ^2.0.10+1
  # flutter_staggered_grid_view: ^0.7.0
  flutter_staggered_animations: ^1.1.1
  dropdown_button2: ^2.3.9
  # motion_tab_bar: ^2.0.4
  # flutter_swipe_action_cell: ^3.1.5
  
  # State Management & Architecture  
  provider: ^6.1.2
  
  # Data Visualization
  fl_chart: ^1.1.0
  
  # Firebase Services
  firebase_core: ^4.1.1
  cloud_firestore: ^6.0.2
  firebase_storage: ^13.0.2
  firebase_auth: ^6.1.0
  # cloud_functions: ^5.6.2  # Temporarily disabled to fix build issue
  
  # Local Storage
  shared_preferences: ^2.3.2
  # path_provider is already in dependencies; remove duplicate from dev_dependencies
  path: ^1.9.0
  flutter_dotenv: ^6.0.0
  # Removed unused local storage deps
  # hive: ^2.2.3
  # hive_flutter: ^1.1.0
  # sqflite: ^2.3.3+1
  # sqflite_common_ffi: ^2.3.3
  # sqflite_common_ffi_web: ^1.0.1+1
  
  # Utilities & Tools
  intl: ^0.20.2
  logging: ^1.3.0
  uuid: ^4.5.1
  connectivity_plus: ^7.0.0
  timezone: ^0.10.1
  csv: ^6.0.0
  crypto: ^3.0.3
  shimmer: ^3.0.0
  
  # Media & File Handling
  # image_picker: ^1.1.2
  file_picker: ^10.3.2
  share_plus: ^12.0.0
  
  # Printing & PDF
  printing: ^5.13.4
  pdf: ^3.11.0
  barcode_widget: ^2.0.4
  
  # Scanner & Detection
  mobile_scanner: ^7.1.2
  
  # Notifications
  flutter_local_notifications: ^19.4.1

  barcode: ^2.2.5
  # Offline Support (moved from dev_dependencies)
  drift: ^2.28.2
  drift_flutter: ^0.2.7
  sqlite3_flutter_libs: ^0.5.18
  path_provider: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  # Code Quality & Linting
  flutter_lints: ^6.0.0
  # App Icon Generation
  flutter_launcher_icons: ^0.14.4
  # Testing
  mockito: ^5.5.1
  build_runner: ^2.9.0
  drift_dev: ^2.28.3
  integration_test:
    sdk: flutter

# App metadata
# author حقل مهجور في أحدث إصدارات Dart
homepage: "https://github.com/yourname/profit_calculator"
repository: "https://github.com/yourname/profit_calculator"
issue_tracker: "https://github.com/yourname/profit_calculator/issues"

flutter:
  generate: true
  uses-material-design: true
  
  # App Assets
  assets:
    - assets/icon/
  
  # Custom Fonts (optional)
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf
  #       - asset: fonts/CustomFont-Bold.ttf
  #         weight: 700

# Flutter Launcher Icons Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#4A90E2"
  adaptive_icon_foreground: "assets/icon/icon.png"

# Remove old linter section - it will be in analysis_options.yaml

